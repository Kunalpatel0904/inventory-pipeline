apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idea-board
  namespace: halcer
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls: [{ hosts: [ideas.example.com], secretName: idea-board-tls }]
  rules:
    - host: ideas.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: idea-board-backend, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: idea-board-frontend, port: { number: 80 } } }
